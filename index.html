=<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zal Planı - Oturacaq Seçimi</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="main-container">
        
        <div class="top-inspector-panel">
            <div class="inspector-header">
                <h2><i class="fa-solid fa-circle-info"></i> Seat Details & Inspector</h2>
                <div class="legend">
                    <div class="legend-item"><span class="box free"></span> Boş</div>
                    <div class="legend-item"><span class="box selected"></span> Seçilib</div>
                    <div class="legend-item"><span class="box occupied"></span> Dolu</div>
                </div>
            </div>

            <div class="inspector-content">
                <div class="selected-seats-box">
                    <span class="label">Seçilmiş Yerlər:</span>
                    <div id="selected-list" class="seats-tags">
                        <span class="empty-msg">Hələ heç bir yer seçilməyib</span>
                    </div>
                </div>

                <div class="checkout-box">
                    <div class="price-info">
                        <span>Cəmi:</span>
                        <strong id="total-amount">0</strong> <span>AZN</span>
                    </div>
                    <button id="buy-btn" class="buy-btn" disabled>
                        <i class="fa-solid fa-ticket"></i> Biletləri Al
                    </button>
                </div>
            </div>
        </div>

        <div class="venue-card">
            <div class="zoom-controls">
                <button id="zoom-in" title="Böyüt"><i class="fa-solid fa-plus"></i></button>
                <button id="zoom-out" title="Kiçilt"><i class="fa-solid fa-minus"></i></button>
                <button id="zoom-reset" title="Sıfırla"><i class="fa-solid fa-rotate-right"></i></button>
            </div>

            <div class="svg-viewport" id="svg-viewport">
                <svg id="hall-svg" viewBox="0 0 800 750" xmlns="http://www.w3.org/2000/svg">
                    <g id="zoom-layer">
                        <polygon points="250,50 550,50 780,480 600,610 200,610 20,480" 
                                 fill="#ffffff" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
                        
                        <g id="seats-group"></g>

                        <!-- Daxili səhnəüstü kəsim xətti -->
                        <polyline points="300,410 500,410 600,480" fill="none" stroke="#333333" stroke-width="1.5"/>

                        <!-- Əsas Səhnə (Mərkəzi boz trapesiya) -->
                        <polygon points="300,430 500,430 580,680 220,680" 
                                 fill="#d1d5db" stroke="#333333" stroke-width="1.5" stroke-linejoin="round"/>
                        
                        <rect x="220" y="700" width="360" height="70" 
                              fill="#9ca3af" stroke="#333333" stroke-width="1.5"/>
                    </g>
                </svg>
            </div>
            
            <div id="tooltip" class="tooltip"></div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
